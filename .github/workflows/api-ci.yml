name: API CI
on:
  pull_request: { paths: ['**/*.go','go.mod','go.sum','api/**'] }
  push: { branches: [main], paths: ['**/*.go','go.mod','go.sum','api/**'] }
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: go mod download
      - run: go vet ./...
      - run: go test ./... -race -count=1
