name: Web CI
on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/web-ci.yml']
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/web-ci.yml']

defaults:
  run:
    working-directory: frontend

jobs:
  ci:
    runs-on: ubuntu-latest
    concurrency:
      group: web-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # node --test runs the .ts tests with native type stripping (22.18+)
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - name: Build (ensures Next.js compiles)
        run: |
          NEXT_PUBLIC_API_URL="https://stats-api.keemlab.com/api" \
          NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
          npm run build
